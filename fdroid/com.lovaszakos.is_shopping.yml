Categories:
  - Shopping List
License: GPL-3.0-only
AuthorName: Ákos Lovász
AuthorEmail: lovasz.akos.dev@gmail.com
SourceCode: https://github.com/Fasz-kivan/IsShopping
IssueTracker: https://github.com/Fasz-kivan/IsShopping/issues
Changelog: https://github.com/Fasz-kivan/IsShopping/releases

AutoName: IsShopping
Description: |-
  A lightweight, simple shopping list with emoji flair.
  Everything is stored strictly offline on-device with zero tracking or network permissions.

RepoType: git
Repo: https://github.com/Fasz-kivan/IsShopping.git

Builds:
  - versionName: 2.0.2
    versionCode: 16
    commit: v2.0.2
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild: echo "flutter.sdk=$$flutter$$" >> android/local.properties
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.0.2
CurrentVersionCode: 16
